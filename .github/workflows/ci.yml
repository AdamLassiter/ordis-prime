name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
        env:
          ORDIS_AUTH_SECRET: ordis-prime-ci-build-placeholder-not-for-runtime
      - name: Verify migrations on an empty database
        run: pnpm db:migrate
        env:
          ORDIS_DATABASE_URL: ${{ runner.temp }}/ordis-prime-ci.sqlite
      - name: Build production container
        run: |
          docker build --target runtime --tag ordis-prime:ci .
          docker build --target worker --tag ordis-prime-worker:ci .
      - name: Verify bundled manual rankings
        run: |
          test "$(docker run --rm --entrypoint sh ordis-prime:ci -c 'set -- /app/data/manual/overframe-*.yaml /app/data/manual/creator-*.yaml; echo "$#"')" -eq 16
          test "$(docker run --rm --entrypoint sh ordis-prime-worker:ci -c 'set -- /app/data/manual/overframe-*.yaml /app/data/manual/creator-*.yaml; echo "$#"')" -eq 16

  publish:
    name: Publish ${{ matrix.target }} image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: runtime
            suffix: ""
          - target: worker
            suffix: -worker
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
