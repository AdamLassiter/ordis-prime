name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
        env:
          ORDIS_AUTH_SECRET: ordis-prime-ci-build-placeholder-not-for-runtime
      - name: Verify migrations on an empty database
        run: pnpm db:migrate
        env:
          ORDIS_DATABASE_URL: ${{ runner.temp }}/ordis-prime-ci.sqlite
      - name: Build production container
        run: docker build --tag ordis-prime:ci .
