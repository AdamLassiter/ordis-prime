<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
<title id="title">Ordis Prime</title><desc id="desc">Ordis's floating black, ivory and gold shell, with two cyan circular lights and a tapered fractured lower body. Transparent background.</desc>
