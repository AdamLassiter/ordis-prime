services:
  ordis-prime:
    build: .
    image: ordis-prime:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ORDIS_DATA_DIR: /data
      ORDIS_SETUP_TOKEN: ${ORDIS_SETUP_TOKEN:?set ORDIS_SETUP_TOKEN}
      ORDIS_AUTH_SECRET: ${ORDIS_AUTH_SECRET:?set ORDIS_AUTH_SECRET}
      ORDIS_ALLOW_REGISTRATION: "false"
    volumes:
      - ordis-prime-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  ordis-prime-data:
