services:
  ordis-prime:
    build:
      context: .
      target: runtime
    image: ordis-prime:local
    restart: unless-stopped
    ports:
      - "${ORDIS_PORT:-3000}:3000"
    environment:
      ORDIS_DATA_DIR: /data
      ORDIS_SETUP_TOKEN: ${ORDIS_SETUP_TOKEN:?set ORDIS_SETUP_TOKEN}
      ORDIS_AUTH_SECRET: ${ORDIS_AUTH_SECRET:?set ORDIS_AUTH_SECRET}
      ORDIS_BASE_URL: ${ORDIS_BASE_URL:-http://localhost:3000}
      ORDIS_ALLOW_REGISTRATION: "false"
    volumes:
      - ordis-prime-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  data-worker:
    build:
      context: .
      target: worker
    image: ordis-prime-worker:local
    restart: unless-stopped
    environment:
      ORDIS_DATA_DIR: /data
      ORDIS_WORLD_STATE_INTERVAL_MS: ${ORDIS_WORLD_STATE_INTERVAL_MS:-300000}
      ORDIS_CATALOG_INTERVAL_MS: ${ORDIS_CATALOG_INTERVAL_MS:-86400000}
      ORDIS_CATALOG_TIMEOUT_MS: ${ORDIS_CATALOG_TIMEOUT_MS:-300000}
      ORDIS_JOB_HISTORY_LIMIT: ${ORDIS_JOB_HISTORY_LIMIT:-1000}
      ORDIS_WORLD_STATE_HISTORY_LIMIT: ${ORDIS_WORLD_STATE_HISTORY_LIMIT:-288}
      ORDIS_NOTIFICATION_RETENTION_MS: ${ORDIS_NOTIFICATION_RETENTION_MS:-2592000000}
    volumes:
      - ordis-prime-data:/data

volumes:
  ordis-prime-data:
